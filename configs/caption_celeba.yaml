image_root: '../FaceCPT/datasets/celeba/images/'
ann_root: '../FaceCPT/datasets/celeba/annotation'
dataset: 'celeba'

# set pretrained as a file path or an url
pretrained: 'checkpoint/cp_pretrain_flip_02.pth' 
# size of vit model; base or large
vit: 'arcface'
batch_size: 64
init_lr: 3e-5 #1e-5

# generation configs
image_size: 112
max_length: 40  
min_length: 15
num_beams: 3
prompt: 'a photo of a person where '

# optimizer
weight_decay: 0.05
min_lr: 0
max_epoch: 5