image_root: './datasets/celeba_text/images/'
ann_root: './datasets/celeba_text/annotation'
dataset: 'celeba_text'

pretrained:  'output/pretrain/cp_pretrain_flip_01.pth'  
img_encoder: 'arcface_50'
batch_size: 128
init_lr: 9e-6

image_size: 112
max_length: 30  
min_length: 10
num_beams: 5
prompt: 'a photo a person where '

weight_decay: 0.05
min_lr: 1e-6
max_epoch: 20