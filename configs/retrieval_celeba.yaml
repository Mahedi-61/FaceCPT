image_root: './datasets/celeba/images/'
ann_root: './datasets/celeba/annotation'
dataset: 'celeba'
pretrained:  'output/pretrain/cp_pretrain_flip_04.pth'

img_encoder: 'arcface_50'
batch_size_train: 128
batch_size_test: 128
init_lr: 3e-6 
max_length: 40

image_size: 112
queue_size: 65536 
alpha: 0.4
k_test: 10         #10 best
negative_all_rank: True

# optimizer
weight_decay: 0.05 #0.02
min_lr: 9e-7
max_epoch: 10