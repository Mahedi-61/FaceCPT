image_root: './datasets/celeba/images/'
ann_root: './datasets/celeba/annotation'
dataset: 'celeba'

pretrained: 'output/pretrain/cp_pretrain_flip_02.pth'  #'checkpoint/retrieval/cp_retrieval_celeba.pth' 

img_encoder: 'arcface'
batch_size_train: 64
batch_size_test: 64
init_lr: 1e-5 #1e-5
max_length: 40

image_size: 112
queue_size: 65536 
alpha: 0.4
k_test: 128
negative_all_rank: True

# optimizer
weight_decay: 0.05
min_lr: 0
max_epoch: 6