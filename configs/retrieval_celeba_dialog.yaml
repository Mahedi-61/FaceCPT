image_root: '../FaceCPT/datasets/celeba_dialog/images/'
ann_root: '../FaceCPT/datasets/celeba_dialog/annotation'
dataset: 'celeba_dialog'

# set pretrained as a file path or an url
pretrained: 'checkpoint/cp_pretrain_flip_02.pth' #'checkpoint/retrieval/cp_retrieval_celeba.pth' 

vit: 'arcface'
batch_size_train: 32
batch_size_test: 64
init_lr: 3e-5 #1e-5

image_size: 112
queue_size: 65536 #57600
alpha: 0.4
k_test: 128
negative_all_rank: True

# optimizer
weight_decay: 0.05
min_lr: 0
max_epoch: 4 #6